name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows kit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Check Directory.Build.props matches the tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)"
          echo "tag=$TAG  Directory.Build.props=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match <Version>$VERSION</Version> in Directory.Build.props"
            exit 1
          fi

      - name: Publish release kit
        run: powershell -ExecutionPolicy Bypass -File scripts/publish-release.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-kit
          path: dist/*.zip
          if-no-files-found: error

  macos:
    name: macOS DMG
    runs-on: macos-latest
    env:
      MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
      MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
      MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Check Directory.Build.props matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)"
          echo "tag=$TAG  Directory.Build.props=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match <Version>$VERSION</Version> in Directory.Build.props"
            exit 1
          fi

      - name: Install macos workload
        run: dotnet workload install macos

      # Skipped when the signing secrets are absent: the job then produces an unsigned DMG.
      - name: Import Developer ID certificate
        if: env.MAC_CERT_P12_BASE64 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$MAC_CERT_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$MAC_CERT_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MAC_CERT_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$CERT_PATH"

      - name: Publish release DMG
        run: bash scripts/publish-release-mac.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: Draft GitHub release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Top section of CHANGELOG.md (from the first "## [" heading to the next one).
      - name: Extract release notes
        run: |
          awk '/^## \[/{ n++; if (n > 1) exit } n == 1 { print }' CHANGELOG.md > release-notes.md
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: release-notes.md
          draft: true
          generate_release_notes: false
